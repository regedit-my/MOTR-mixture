<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MOTR — Разделение пати</title>
<style>
  :root { --bg: #0e0f14; --panel: #171920; --panel-border: #272a35; --text: #e8e9ee; --text-dim: #8b8e9c; --accent: #5b8cff; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    max-width: 480px;
    padding: 28px;
    text-align: center;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--text-dim); font-size: 13.5px; line-height: 1.5; margin: 0 0 20px; }
  .links { display: flex; flex-direction: column; gap: 10px; }
  a.link {
    display: block;
    text-decoration: none;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--text);
    font-weight: 600;
    font-size: 14px;
  }
  a.link:hover { border-color: var(--accent); }
  a.link span { display: block; font-weight: 400; color: var(--text-dim); font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Разделение пати — Mixture Instance</h1>
    <p>Выбери версию:</p>
    <div class="links">
      <a class="link" href="v3/index.html">v3 — свои пресеты<span>Готовые маршруты + свой редактор, сохраняется в браузере</span></a>
      <a class="link" href="v2/index.html">v2 — (актуальная)<span>Готовые маршруты</span></a>
      <a class="link" href="v1/index.html">v1 — алгоритмы<span>Маршруты строятся автоматически по карте</span></a>
    </div>
  </div>
</body>
</html>
